frontend:
  name: employment-insurance
  replicaCount: 1
  image:
    repository: mfe-pot-employment-insurance
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  servicePort: 80
  # Same-origin: the BFF is exposed under this same hostname via the /api
  # Ingress path rule below, not a separate hostname -- see CLAUDE.md's
  # Hosting section on why (reduces the real hostname count, makes this
  # call same-origin). Matches apps/employment-insurance/src/runtime-config.ts's shape.
  # Empty, not "/api": HttpEmploymentInsuranceApiClient already appends
  # "/api/..." itself (`${baseUrl}/api/claims`), so this value is just
  # "this app's own origin" -- shared-runtime-config's fetchRuntimeConfig
  # resolves "" to that origin. A literal "/api" here double-prefixes
  # every request to /api/api/... and 404s.
  # strapiBaseUrl is browser-to-server (ContentClient fetches Strapi
  # directly, same as shell's federation-manifest fetch) -- the real
  # public Ingress hostname from mfe-pot-platform's charts/strapi, not
  # in-cluster Service DNS.
  runtimeConfig:
    employmentInsuranceBffBaseUrl: ""
    strapiBaseUrl: "http://cms.mfe-pot.local"

backend:
  name: employment-insurance-bff
  replicaCount: 1
  image:
    repository: mfe-pot-employment-insurance-bff
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3002
  servicePort: 3002
  # session-cache is a separate Helm release in mfe-pot-platform (see its
  # charts/session-cache), installed once independently of any per-app
  # chart -- genuine cross-Helm-release in-cluster Service DNS, same
  # pattern as dashboard-bff's JOB_BANK_BFF_URL/EMPLOYMENT_INSURANCE_BFF_URL.
  env:
    HOST: "0.0.0.0"
    PORT: "3002"
    REDIS_URL: "redis://session-cache.default.svc.cluster.local:6379"

ingress:
  host: employment-insurance.mfe-pot.local
  className: nginx
