<section class="ei-claims">
  <h2>Claim status</h2>
  @if (loadError()) {
    <p role="alert">Claim status is temporarily unavailable.</p>
  } @else if (loaded()) {
    @if (claim(); as activeClaim) {
      <scds-card
        [cardTitle]="'Claim ' + activeClaim.id"
        [description]="'Status: ' + activeClaim.status + '.'"
        [tone]="claimTone(activeClaim)"
      ></scds-card>
    } @else {
      <p>No claim on file yet.</p>
    }
  }
</section>
