<section class="reporting-status">
  <h2>{{ 'reportingStatus.heading' | transloco }}</h2>
  @if (loadError()) {
    <p role="alert">{{ 'reportingStatus.unavailable' | transloco }}</p>
  } @else if (loaded()) {
    @if (reportingStatus(); as status) {
      <scds-card
        [cardTitle]="statusLabelKey() | transloco"
        [description]="'reportingStatus.nextReportDue' | transloco: { date: formattedNextReportDue(), days: status.daysUntilDue }"
        [tone]="statusTone()"
      ></scds-card>
    } @else {
      <p>{{ 'reportingStatus.noClaim' | transloco }}</p>
    }
  }
</section>
