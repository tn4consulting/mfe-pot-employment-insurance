<section class="ei-applications">
  <h1>Employment Insurance — Apply</h1>
  @if (confirmation(); as claim) {
    <scds-card
      role="status"
      [cardTitle]="'Claim ' + claim.id"
      [description]="confirmationDescription(claim)"
      [tone]="confirmationTone(claim)"
    ></scds-card>
  } @else if (submitError()) {
    <p role="alert">EI applications are temporarily unavailable.</p>
  } @else {
    <p>Apply for Employment Insurance benefits.</p>
    <button type="button" [disabled]="submitting()" (click)="apply()">Apply for EI</button>
  }
</section>
